name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      # -count=1 disables the test cache: a PR gate that could report a
      # stale pass would defeat the point of gating on it. Verbose so a
      # failure in the concurrent lock test (e2e_test.go) shows which
      # agent lost and how, not just "FAIL".
      - run: go test ./... -v -count=1
